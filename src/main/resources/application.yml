spring:
  application:
    name: javagpt

server:
  port: 8080

javagpt:
  llm:
    enabled: true
    engine: llamacpp           # Options: jlama, llamacpp
    model-path: "./models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
    max-tokens: 1024
    temperature: 0.7
    top-k: 40
    top-p: 0.9

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
